name: nanoclaw

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        UV_VERSION: ${UV_VERSION:-0.11.28}
    restart: unless-stopped
    init: true
    env_file:
      - .env
    environment:
      # Uvicorn must listen on the container interface. Published ports remain
      # loopback-only on the host unless the operator explicitly changes it.
      NANOCLAW_WEB_HOST: 0.0.0.0
      NANOCLAW_WEB_PORT: "8765"
      NANOCLAW_WORKSPACE_WEB_HOST: 0.0.0.0
      NANOCLAW_WORKSPACE_WEB_PORT: "8767"
      NANOCLAW_CUSTOMER_PRODUCT_REDIS_URL: redis://redis:6379/0
      EMPLOYEE_AGENT_CHECKPOINT_BACKEND: redis
      EMPLOYEE_AGENT_REDIS_URL: redis://redis:6379/1
      DUE_DILIGENCE_REDIS_URL: redis://redis:6379/3
      NANOCLAW_MEMORY_MYSQL_HOST: mysql
      BUSINESS_DATABASE_BACKEND: mysql
      TRADE_OPS_MYSQL_HOST: mysql
      TRADE_OPS_MYSQL_PORT: "3306"
      TRADE_OPS_MYSQL_DATABASE: ${NANOCLAW_MEMORY_MYSQL_DATABASE:-nanoclaw_memory}
      TRADE_OPS_MYSQL_USER: ${NANOCLAW_MEMORY_MYSQL_USER:-nanoclaw}
      TRADE_OPS_MYSQL_PASSWORD: ${NANOCLAW_MEMORY_MYSQL_PASSWORD}
      PADDLE_PDX_CACHE_HOME: /app/.paddlex
      PADDLE_PDX_DISABLE_MODEL_SOURCE_CHECK: "True"
    ports:
      - "${NANOCLAW_BIND_ADDRESS:-127.0.0.1}:${NANOCLAW_WEB_PUBLIC_PORT:-8765}:8765"
    volumes:
      - nanoclaw_workspace:/app/workspace
      - nanoclaw_data:/app/data
    depends_on:
      redis:
        condition: service_healthy
      mysql:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - /app/.venv/bin/python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/healthz', timeout=5).read()"
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    stop_grace_period: 45s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    shm_size: 1gb

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - nanoclaw_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${NANOCLAW_MEMORY_MYSQL_DATABASE:-nanoclaw_memory}
      MYSQL_USER: ${NANOCLAW_MEMORY_MYSQL_USER:-nanoclaw}
      MYSQL_PASSWORD: ${NANOCLAW_MEMORY_MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${NANOCLAW_MEMORY_MYSQL_ROOT_PASSWORD}
    ports:
      - "127.0.0.1:${NANOCLAW_MEMORY_MYSQL_PORT:-3306}:3306"
    volumes:
      - nanoclaw_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$${MYSQL_USER} -p$${MYSQL_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

volumes:
  nanoclaw_workspace:
  nanoclaw_data:
  nanoclaw_redis:
  nanoclaw_mysql:
