[project]
name = "rfq-pilot"
version = "0.1.0"
description = "AI-assisted foreign trade inquiry, research, quotation, and approval workspace"
readme = "README.md"
requires-python = "==3.11.9"
dependencies = [
    "aiosqlite>=0.22.1",
    "argon2-cffi>=23.1.0",
    "fastapi>=0.110.0",
    "httpx>=0.27.0",
    "lark-oapi==1.6.4",
    "mcp==1.27.0",
    "openai==1.93.0",
    "numpy==2.4.1",
    "paddleocr==3.3.3",
    "paddlepaddle==3.2.2",
    "pillow==12.3.0",
    "pdfplumber==0.11.10",
    "pgvector==0.5.0",
    "psycopg[binary]==3.3.4",
    "pymilvus==2.5.18",
    "pymysql==1.1.2",
    "pypdf==6.14.2",
    "pytest>=9.1.1",
    "pyyaml==6.0.2",
    "qq-botpy==1.2.1",
    "uvicorn>=0.29.0",
    "websockets>=12.0",
    "sqlite-vec==0.1.9",
    "langchain>=1.0,<2.0",
    "langgraph>=1.0,<2.0",
    "redis>=5.2,<8.0",
    "langgraph-checkpoint-sqlite>=3.1.1",
    "langgraph-checkpoint-redis>=0.4.1,<0.5",
    "boto3>=1.43.99",
    "tokenizers==0.22.1",
]

[tool.pytest.ini_options]
testpaths = ["test"]
